services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticket_booking
      POSTGRES_PASSWORD: ticket_booking
      POSTGRES_DB: ticket_booking
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticket_booking']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the API sends. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

volumes:
  postgres-data:
